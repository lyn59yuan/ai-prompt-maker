<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Prompt Maker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      background: #f7f7f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    .logo {
      font-size: 56px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 15px;
    }

    .subtitle {
      font-size: 18px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .start-button {
      border: none;
      background: #111;
      color: white;
      padding: 18px 45px;
      border-radius: 50px;
      font-size: 18px;
      cursor: pointer;
    }

    .start-button:hover {
      opacity: 0.8;
    }

    .note {
      margin-top: 30px;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">✨</div>

    <h1>AI Prompt Maker</h1>

    <div class="subtitle">
      把你的想法一步一步整理<br>
      自動產生可以直接交給 AI 的完整指令
    </div>

    <button class="start-button" onclick="start()">
      開始製作
    </button>

    <div class="note">
      只需要回答幾個問題，就能完成
    </div>

  </div>

  <script>
    function start() {
      alert("我們開始製作你的 AI 工具！");
    }
  </script>

</body>
</html>
