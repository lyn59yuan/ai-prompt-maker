<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Prompt Maker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      background: #f7f7f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    .logo {
      font-size: 56px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 15px;
    }

    .subtitle {
      font-size: 18px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    button {
      border: none;
      background: #111;
      color: white;
      padding: 18px 45px;
      border-radius: 50px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    .note {
      margin-top: 30px;
      color: #999;
      font-size: 14px;
    }

    .progress {
      color: #999;
      font-size: 15px;
      margin-bottom: 25px;
    }

    .question {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .description {
      color: #777;
      font-size: 16px;
      margin-bottom: 30px;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 18px;
      font-size: 17px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      background: white;
    }

    textarea:focus {
      border-color: #111;
    }

    .next-button {
      margin-top: 25px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <!-- 首頁 -->
  <div id="home" class="container">

    <div class="logo">✨</div>

    <h1>AI Prompt Maker</h1>

    <div class="subtitle">
      把你的想法一步一步整理<br>
      自動產生可以直接交給 AI 的完整指令
    </div>

    <button onclick="start()">
      開始製作
    </button>

    <div class="note">
      只需要回答幾個問題，就能完成
    </div>

  </div>


  <!-- 第 1 題 -->
  <div id="questionPage" class="container hidden">

    <div class="progress">
      第 1 題 / 12
    </div>

    <div class="question">
      你想要製作什麼？
    </div>

    <div class="description">
      請簡單描述你想做的網站、工具或 App。
    </div>

    <textarea
      id="answer"
      placeholder="例如：我想做一個美甲預約網站..."
    ></textarea>

    <br>

    <button class="next-button" onclick="nextQuestion()">
      下一步 →
    </button>

  </div>


  <script>

    function start() {
      document.getElementById("home").classList.add("hidden");
      document.getElementById("questionPage").classList.remove("hidden");
    }

    function nextQuestion() {

      const answer = document.getElementById("answer").value.trim();

      if (answer === "") {
        alert("請先回答問題！");
        return;
      }

      alert("回答已保存！下一步我們會加入第 2 題。");

      console.log("第 1 題答案：", answer);
    }

  </script>

</body>
</html>
